<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UTUP · MVP 收敛版 · 跨域标签连接器</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
  if(typeof echarts!=="undefined"){
    echarts.registerTheme("bytefe",{
      color:["#3370FF","#722ED1","#14C9C9","#F7BA1E","#F5319D","#00B42A","#FF7D00","#F53F3F","#165DFF","#2BC2FF"],
      backgroundColor:"transparent",
      textStyle:{fontFamily:'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif',color:"#4E5969"},
      title:{textStyle:{color:"#1D2129",fontWeight:600,fontSize:13},subtextStyle:{color:"#86909C"}},
      legend:{textStyle:{color:"#4E5969"},itemGap:14},
      grid:{left:"3%",right:"4%",bottom:"6%",top:36,containLabel:true},
      tooltip:{backgroundColor:"rgba(255,255,255,.96)",borderColor:"#E5E6EB",borderWidth:1,
        textStyle:{color:"#1D2129",fontSize:12},
        extraCssText:"box-shadow:0 6px 24px rgba(31,35,41,.10);border-radius:6px;backdrop-filter:blur(8px)",
        axisPointer:{lineStyle:{color:"#C9CDD4",type:"dashed"},crossStyle:{color:"#C9CDD4"}}},
      categoryAxis:{axisLine:{lineStyle:{color:"#E5E6EB"}},axisTick:{show:false},
        axisLabel:{color:"#86909C",fontSize:11},splitLine:{show:false}},
      valueAxis:{axisLine:{show:false},axisTick:{show:false},
        axisLabel:{color:"#86909C",fontSize:11},splitLine:{lineStyle:{color:"#E5E6EB",type:"dashed"}}}
    });
    echarts.__bytefe_init=echarts.init;
    echarts.init=function(dom,theme,opts){return echarts.__bytefe_init(dom,theme||"bytefe",opts);};
  }
</script>
<style>
  :root{
    --bg:#F2F3F5; --bg2:#F7F8FA; --bg3:#FAFBFC; --card:#FFFFFF; --surface:#FFFFFF;
    --glass:rgba(255,255,255,.72);
    --line:#E5E6EB; --line-strong:#C9CDD4; --line-soft:#F2F3F5;
    --text:#1D2129; --text2:#4E5969; --mute:#86909C; --mute2:#C9CDD4;
    --p:#3370FF; --p-hover:#4080FF; --p-active:#165DFF; --p2:#722ED1;
    --p-light:#E8F3FF; --p-soft:#F2F8FF;
    --c-blue:#3370FF; --c-blue-l:#E8F3FF; --c-cyan:#14C9C9; --c-cyan-l:#DCFFFE;
    --c-purple:#722ED1; --c-purple-l:#F5E8FF; --c-magenta:#F5319D; --c-magenta-l:#FFE6F2;
    --c-green:#00B42A; --c-green-l:#E8FFEA; --c-gold:#F7BA1E; --c-gold-l:#FFFBE6;
    --c-orange:#FF7D00; --c-orange-l:#FFF7E8; --c-red:#F53F3F; --c-red-l:#FFECE8;
    --ok:#00B42A; --ok-light:#E8FFEA; --warn:#FF7D00; --warn-light:#FFF7E8;
    --err:#F53F3F; --err-light:#FFECE8; --info:#3370FF; --info-light:#E8F3FF;
    --l1:#00B42A; --l1-light:#E8FFEA; --l2:#3370FF; --l2-light:#E8F3FF;
    --l3:#FF7D00; --l3-light:#FFF7E8; --l4:#F53F3F; --l4-light:#FFECE8;
    --grad-brand:linear-gradient(135deg,#3370FF 0%,#722ED1 100%);
    --grad-cyan:linear-gradient(135deg,#3370FF 0%,#14C9C9 100%);
    --grad-magenta:linear-gradient(135deg,#722ED1 0%,#F5319D 100%);
    --grad-warm:linear-gradient(135deg,#F7BA1E 0%,#FF7D00 100%);
    --grad-aurora:linear-gradient(120deg,rgba(51,112,255,.08) 0%,rgba(114,46,209,.06) 50%,rgba(20,201,201,.08) 100%);
    --shadow:0 2px 8px rgba(31,35,41,.06); --shadow-md:0 4px 14px rgba(31,35,41,.08);
    --shadow-lg:0 6px 24px rgba(31,35,41,.10); --shadow-xl:0 12px 36px rgba(31,35,41,.14);
    --shadow-glow-blue:0 6px 20px rgba(51,112,255,.18);
    --r-sm:4px; --r:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
    --ease:cubic-bezier(.34,.69,.1,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --t-fast:.15s var(--ease); --t:.24s var(--ease); --t-slow:.4s var(--ease-out);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI","Helvetica Neue",sans-serif;
       background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body::before{content:"";position:fixed;inset:0;background:
    radial-gradient(circle at 8% 8%,rgba(51,112,255,.06),transparent 40%),
    radial-gradient(circle at 92% 12%,rgba(114,46,209,.05),transparent 40%),
    radial-gradient(circle at 50% 100%,rgba(20,201,201,.04),transparent 50%);pointer-events:none;z-index:0}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;outline:none}
  ::selection{background:rgba(51,112,255,.18);color:var(--p-active)}

  /* LOGIN */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 20% 20%,rgba(51,112,255,.18),transparent 45%),
      radial-gradient(circle at 80% 80%,rgba(114,46,209,.16),transparent 45%),
      radial-gradient(circle at 50% 50%,rgba(20,201,201,.10),transparent 60%),
      linear-gradient(135deg,#E8F3FF 0%,#F2F3F5 60%,#FFF 100%);z-index:9999;overflow:hidden}
  .login::before,.login::after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;
    filter:blur(80px);opacity:.55;animation:floaty 14s ease-in-out infinite}
  .login::before{background:var(--grad-brand);top:-160px;left:-120px}
  .login::after{background:var(--grad-magenta);bottom:-160px;right:-120px;animation-delay:-7s}
  @keyframes floaty{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
  .login-card{width:540px;padding:40px;background:var(--glass);border:1px solid rgba(255,255,255,.6);
    border-radius:var(--r-lg);box-shadow:var(--shadow-xl);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);position:relative;z-index:1}
  .login-card h1{font-size:24px;margin-bottom:6px;font-weight:600;
    background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-card p.sub{color:var(--mute);font-size:13px;margin-bottom:8px}
  .mvp-flag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;margin-bottom:18px;
    background:var(--warn-light);color:var(--warn);border:1px solid rgba(255,125,0,.3);font-weight:500}
  .role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  .role-card{padding:14px;border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;
    background:#FFF;transition:all var(--t);position:relative;overflow:hidden}
  .role-card::before{content:"";position:absolute;inset:0;background:var(--grad-aurora);opacity:0;transition:opacity var(--t)}
  .role-card:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--shadow-glow-blue)}
  .role-card:hover::before{opacity:1}
  .role-card>*{position:relative;z-index:1}
  .role-card.selected{border-color:var(--p);background:var(--p-light);box-shadow:0 0 0 1px var(--p) inset,var(--shadow-glow-blue)}
  .role-name{font-weight:600;margin-bottom:4px;font-size:14px;color:var(--text)}
  .role-desc{font-size:11px;color:var(--mute);line-height:1.5}
  .login-btn{width:100%;padding:12px;background:var(--grad-brand);color:#fff;border-radius:var(--r);
    font-weight:500;font-size:14px;margin-top:8px;transition:all var(--t);box-shadow:var(--shadow-glow-blue);letter-spacing:.5px}
  .login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(51,112,255,.32)}
  .login-foot{margin-top:14px;font-size:11px;color:var(--mute);text-align:center;line-height:1.6}

  /* LAYOUT */
  .app{display:none;height:100vh;grid-template-columns:246px 1fr;grid-template-rows:56px 1fr;position:relative;z-index:1}
  .app.active{display:grid;animation:fadeIn .3s var(--ease-out)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .topbar{grid-column:1/3;display:flex;align-items:center;padding:0 20px;background:var(--glass);
    border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);box-shadow:0 1px 0 rgba(31,35,41,.04);position:relative;z-index:10}
  .logo{font-weight:700;font-size:16px;margin-right:24px;letter-spacing:.5px;
    background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .breadcrumb{color:var(--mute);font-size:12px;flex:1}
  .breadcrumb b{color:var(--text);font-weight:500}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:12px}
  .role-tag{padding:4px 10px;border-radius:var(--r-sm);background:var(--p-light);
    border:1px solid rgba(51,112,255,.2);color:var(--p);font-size:11px;font-weight:500}
  .user-info{display:flex;align-items:center;gap:8px;color:var(--text2)}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--grad-brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;box-shadow:var(--shadow-glow-blue)}
  .logout{color:var(--mute);cursor:pointer;transition:color var(--t-fast)}
  .logout:hover{color:var(--err)}
  .sidebar{background:#FFFFFF;border-right:1px solid var(--line);overflow-y:auto;padding:8px 0}
  .nav-group{margin-bottom:8px}
  .nav-title{padding:10px 20px 4px;font-size:11px;color:var(--mute);letter-spacing:.5px;font-weight:500}
  .nav-item{padding:9px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--text2);
    font-size:13px;border-left:2px solid transparent;
    transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast);position:relative}
  .nav-item:hover{background:var(--p-light);color:var(--p)}
  .nav-item.active{background:var(--p-light);color:var(--p);border-left-color:var(--p);font-weight:500}
  .nav-item.active::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-radius:50%;
    background:var(--p);transform:translateY(-50%);box-shadow:0 0 8px var(--p)}
  .nav-item.locked{color:var(--mute2);cursor:not-allowed}
  .nav-item.locked::after{content:"🔒";margin-left:auto;font-size:10px;filter:grayscale(1)}
  .nav-item .soon{margin-left:auto;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--bg2);
    color:var(--mute);border:1px solid var(--line)}

  .main{overflow-y:auto;padding:20px;background:var(--bg);position:relative;z-index:1}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:14px;flex-wrap:wrap}
  .page-title{font-size:20px;font-weight:600;color:var(--text);letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .page-desc{color:var(--mute);font-size:12px;margin-top:4px;max-width:720px;line-height:1.6}

  /* delivery badge */
  .db{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;letter-spacing:.2px;white-space:nowrap}
  .db.deliver{background:var(--ok-light);color:var(--ok);border:1px solid rgba(0,180,42,.3)}
  .db.degrade{background:var(--warn-light);color:var(--warn);border:1px solid rgba(255,125,0,.3)}
  .db.p1{background:var(--bg2);color:var(--mute);border:1px solid var(--line-strong)}
  .stepcode{font-size:10px;font-family:"SF Mono",Menlo,Consolas,monospace;padding:1px 7px;border-radius:4px;
    background:var(--p-soft);color:var(--p);border:1px solid rgba(51,112,255,.2)}

  /* CARD */
  .grid{display:grid;gap:14px}
  .card{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow);
    transition:transform var(--t),box-shadow var(--t),border-color var(--t);position:relative;overflow:hidden}
  .card:hover{box-shadow:var(--shadow-md)}
  .card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;
    justify-content:space-between;color:var(--text);letter-spacing:.2px;gap:10px}
  .card h3 .badge{font-size:11px;padding:2px 8px;border-radius:var(--r-sm);background:var(--p-light);color:var(--p);font-weight:400}
  .card-sub{font-size:12px;color:var(--mute);margin:-6px 0 12px;line-height:1.6}

  /* KPI */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:#FFFFFF;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;position:relative;
    overflow:hidden;box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
  .kpi::before{content:"";position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,rgba(51,112,255,.10),transparent 70%);transition:transform var(--t-slow)}
  .kpi:hover::before{transform:scale(1.4)}
  .kpi::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--grad-brand);opacity:.85}
  .kpi.domain-kpi{cursor:pointer}
  .kpi.domain-kpi:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--shadow-glow-blue)}
  .kpi.domain-kpi:nth-child(1)::after{background:linear-gradient(90deg,var(--c-blue),var(--c-cyan))}
  .kpi.domain-kpi:nth-child(2)::after{background:linear-gradient(90deg,var(--c-cyan),var(--c-green))}
  .kpi.domain-kpi:nth-child(3)::after{background:linear-gradient(90deg,var(--c-purple),var(--c-magenta))}
  .kpi.domain-kpi:nth-child(4)::after{background:linear-gradient(90deg,var(--c-gold),var(--c-orange))}
  .kpi-label{font-size:12px;color:var(--mute);margin-bottom:8px;display:flex;align-items:center;gap:4px}
  .kpi-value{font-size:26px;font-weight:600;color:var(--text);line-height:1.2;font-feature-settings:"tnum"}
  .kpi-value small{font-size:13px;color:var(--mute);font-weight:400}
  .kpi-trend{font-size:11px;margin-top:6px;color:var(--mute)}
  .kpi-trend.up{color:var(--ok)}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:13px;color:var(--text2)}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--text2);font-weight:500;font-size:12px;background:var(--bg2);position:sticky;top:0;z-index:1}
  tbody tr{transition:background var(--t-fast)}
  tr:hover td{background:var(--bg2)}
  tr.clk{cursor:pointer}
  .level{display:inline-block;padding:2px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:500;transition:transform var(--t-fast)}
  .level:hover{transform:translateY(-1px)}
  .level.l1{background:var(--l1-light);color:var(--l1);border:1px solid rgba(0,180,42,.25)}
  .level.l2{background:var(--l2-light);color:var(--l2);border:1px solid rgba(51,112,255,.25)}
  .level.l3{background:var(--l3-light);color:var(--l3);border:1px solid rgba(255,125,0,.25)}
  .level.l4{background:var(--l4-light);color:var(--l4);border:1px solid rgba(245,63,63,.25)}
  .pill{display:inline-block;padding:2px 8px;border-radius:var(--r-sm);font-size:11px;background:var(--p-light);
    color:var(--p);border:1px solid rgba(51,112,255,.2);transition:all var(--t-fast)}
  .cross-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 7px;border-radius:10px;
    background:var(--c-magenta-l);color:var(--c-magenta);border:1px solid rgba(245,49,157,.3);font-weight:500}

  /* BUTTON */
  .btn{padding:6px 14px;border-radius:var(--r-sm);font-size:13px;background:var(--p);color:#fff;font-weight:400;
    transition:all var(--t-fast);border:1px solid var(--p);position:relative;overflow:hidden}
  .btn:hover{background:var(--p-hover);border-color:var(--p-hover);transform:translateY(-1px);box-shadow:var(--shadow-glow-blue)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{background:var(--bg2);border-color:var(--line);color:var(--mute2);cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:#FFF;border:1px solid var(--line);color:var(--text2)}
  .btn-ghost:hover{background:var(--p-light);border-color:var(--p);color:var(--p);box-shadow:var(--shadow)}
  .btn-warn{background:var(--warn-light);color:var(--warn);border:1px solid rgba(255,125,0,.3)}
  .btn-warn:hover{background:var(--warn);color:#fff;box-shadow:0 6px 20px rgba(255,125,0,.18)}
  .btn-sm{padding:4px 10px;font-size:12px}

  /* FLOW */
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
  .flow-step{padding:8px 14px;border-radius:var(--r);background:var(--p-light);border:1px solid rgba(51,112,255,.25);
    position:relative;color:var(--p);transition:all var(--t)}
  .flow-step:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .flow-step.done{background:var(--ok-light);border-color:rgba(0,180,42,.3);color:var(--ok)}
  .flow-step.active{background:var(--grad-brand);border:1px solid var(--p);color:#fff;box-shadow:var(--shadow-glow-blue)}
  .flow-step .sc{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10px;opacity:.8;margin-right:4px}
  .flow-arrow{color:var(--mute);font-size:14px}

  /* MASKED */
  .masked{color:var(--warn);background:var(--warn-light);padding:1px 6px;border-radius:var(--r-sm);
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px}
  .raw{color:var(--err);background:var(--err-light);padding:1px 6px;border-radius:var(--r-sm);
    font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px}

  /* SEARCH */
  .search-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .search-bar input,.search-bar select{flex:1;min-width:130px;padding:8px 12px;background:#FFF;
    border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font-size:13px;outline:none;
    transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .search-bar input:focus,.search-bar select:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(51,112,255,.12)}

  /* CONFIG FORM (可配置页表单控件) */
  .cfg-input,.cfg-select{width:100%;padding:6px 10px;background:var(--bg3);border:1px solid var(--line);
    border-radius:var(--r-sm);color:var(--text);font-size:13px;outline:none;
    transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast)}
  .cfg-input:hover,.cfg-select:hover{border-color:var(--line-strong)}
  .cfg-input:focus,.cfg-select:focus{border-color:var(--p);background:#FFF;box-shadow:0 0 0 3px rgba(51,112,255,.12)}
  .cfg-select{cursor:pointer}

  /* INCOME FORM (消费与收益录入) */
  .form-grid{display:flex;flex-direction:column;gap:16px}
  .form-row{display:flex;flex-direction:column;gap:8px}
  .form-label{font-size:13px;font-weight:500;color:var(--text)}
  .asset-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
  .asset-chk{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border:1px solid var(--line);
    border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all var(--t-fast)}
  .asset-chk:hover{border-color:var(--p);background:var(--p-soft)}
  .asset-chk input{accent-color:var(--p);width:15px;height:15px;cursor:pointer;flex:0 0 auto}
  .asset-chk:has(input:checked){border-color:var(--p);background:var(--p-light);color:var(--text)}
  .doc-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--bg3);
    border:1px dashed var(--line-strong);border-radius:var(--r-sm)}

  /* TAB */
  .tab-bar{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;gap:4px;overflow-x:auto}
  .tab{padding:10px 16px;cursor:pointer;color:var(--mute);font-size:13px;border-bottom:2px solid transparent;
    transition:all var(--t-fast);white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:500}

  /* ALERT */
  .alert{padding:10px 14px;border-radius:var(--r-sm);font-size:12px;margin-bottom:12px;display:flex;
    align-items:center;gap:8px;border-left:3px solid;line-height:1.6}
  .alert.info{background:var(--info-light);border:1px solid rgba(51,112,255,.2);border-left-color:var(--info);color:var(--p)}
  .alert.warn{background:var(--warn-light);border:1px solid rgba(255,125,0,.25);border-left-color:var(--warn);color:var(--warn)}
  .alert.ok{background:var(--ok-light);border:1px solid rgba(0,180,42,.25);border-left-color:var(--ok);color:var(--ok)}

  ::-webkit-scrollbar{width:8px;height:8px}

function el(id){ return document.getElementById(id); }

function closeModal(){ el("modal").classList.remove("active"); }
function openModal(html){ el("modalInner").innerHTML=html; el("modal").classList.add("active"); }
function pageHead(title,codes,desc,badge){
  return `<div class="page-head"><div>

function deliverBadge(t){ // 交付 / 降级交付 / P1
  if(t==="交付") return `<span class="db deliver">交付</span>`;

  return `<span class="db p1">P1 · 本期不做</span>`;
}

/* 可见性判定矩阵（A7 / 3.1）：返回 {visible, real, canApply, reason} */
function visibility(tag){
  const v=V(); const lv=tag.level; const wl=v.wl;
  const crossDomain = tag.domain!==v.domain && v.domain!=="平台";
  const effLevel = crossDomain ? upgrade(lv) : lv; // 跨域升档
  if(lv==="开放") return {visible:true, real:true, canApply:true, cross:crossDomain, eff:effLevel, reason:"自助订阅免审批"};
  if(lv==="通用") return {visible:true, real:true, canApply:true, cross:crossDomain, eff:effLevel, reason:"自助申请留痕"};
  if(lv==="受控"){
    if(wl) return {visible:true, real:false, canApply:true, cross:crossDomain, eff:effLevel, reason:"Owner 审批"};
    return {visible:true, real:false, canApply:false, cross:crossDomain, eff:effLevel, reason:"非白名单，请走本域 POC 前置收口"};
  }
  // 高敏
  if(wl) return {visible:true, real:false, canApply:true, cross:crossDomain, eff:effLevel, reason:"跳来源方合规流程 + 法务加签"};
  return {visible:false, real:false, canApply:false, cross:crossDomain, eff:effLevel, reason:"非白名单，高敏标签不可见"};
}

function toggleAllAp(ck){ APPROVALS.filter(a=>a.status==="待审批").forEach(a=>ck?apSel.add(a.id):apSel.delete(a.id)); renderApBody(); }

function oneApprove(id,act){
  if(act==="拒绝"){ const r=prompt("请填写拒绝原因（Triton 工单必填）："); if(r===null) return; setApResult([id],"已拒绝",r); }
  else setApResult([id],"已通过");
}
function batchApprove(act){
  if(!apSel.size){ toast("请先勾选申请"); return; }
  const ids=[...apSel];
  if(act==="拒绝"){ const r=prompt(`批量拒绝 ${ids.length} 条，请填写原因：`); if(r===null) return; setApResult(ids,"已拒绝",r); }
  else { if(!confirm(`确认批量通过 ${ids.length} 条申请？结果将回写 Triton 工单。`)) return; setApResult(ids,"已通过"); }
  apSel.clear();
}
function setApResult(ids,status,reason){
  ids.forEach(id=>{ const a=APPROVALS.find(x=>x.id===id); if(a){ a.status=status; if(reason) a.reject=reason; pushAudit(`审批${status==="已通过"?"通过":"拒绝"}：${a.tag}（${a.applicant}）`, a.level); }});
  toast(`✓ ${ids.length} 条申请已${status.replace("已","")}，结果回写 Triton 工单，列表已刷新`);
  viewApproval(el("main"));
}

  const assets=[...document.querySelectorAll(".if-asset:checked")].map(x=>x.value);
  if(!assets.length){ toast("请至少选择 1 个数据资产"); return; }
  if(!incomeDoc){ toast("请上传或粘贴 1 份飞书文档作为佐证"); return; }
  const scene=el("ifScene").value, income=el("ifIncome").value.trim()||"（未填写）";
  HARVEST.income.unshift({assets, scene, income, doc:incomeDoc.name, docUrl:incomeDoc.url, by:"user", at:new Date().toISOString().slice(0,16).replace("T"," ")});
  pushAudit(`录入消费收益：${assets.join("、")} · ${scene}`);
  toast("✓ 收益录入已保存，已镜像同步至供给方");
  viewIncome(el("main"));
}

/* ======================= 分级与跨域配置（合并页 · 整体下拉框配置 · P1） ======================= */
// 下拉选项集（路由配置项整体改用下拉框）
const CFG_OPTS = {
  approve:["免审批 · 自助订阅","自助申请 + 留痕","来源方 Owner 审批","来源方合规流程"],
  approver:["—","平台自动通过","标签 Owner / 团队","跳转来源方审批系统 + 法务加签"],
  valid:["永久（默认 180 天）","180 天","90 天","30 天"]
};
function cfgSelect(l,f){
  const cur=LEVELS[l][f];
  const opts=CFG_OPTS[f].slice();
  if(!opts.includes(cur)) opts.unshift(cur); // 兜底：保留当前值
  return `<select class="cfg-select rt-sel" data-lvl="${l}" data-f="${f}">${opts.map(o=>`<option${o===cur?" selected":""}>${o}</option>`).join("")}</select>`;
}
let crossDemo={consumer:"电商", tag:"生服"};
function viewCfg(c){
  const editable=canConfig();
  const roBadge=`<span class="badge" style="background:var(--bg2);color:var(--mute)">只读 · 仅供给方 / 平台可配置</span>`;
  let html=pageHead("分级与跨域配置",null,
    "供给方在此集中维护两类策略：①「统一分级 → 审批链路」路由（审批方式、审批人、有效期）；②「跨域就高定级」升档规则。所有配置项均以下拉框选择，保存后即时生效并驱动消费方申请路由与升档模拟，不回写 Triton。",
    {c:"p1",t:"P1"});

  // ① 分级审批路由配置（下拉框）
  html+=`<div class="card">
    <h3>① 分级 → 审批路由配置 ${editable?`<span class="badge">可配置</span>`:roBadge}</h3>
    <div class="card-sub">${editable?"审批方式 / 审批人 / 有效期均通过下拉框选择，保存后同步影响消费方申请时的路由展示与审批链路。":"当前视角为消费方，仅可查看路由策略，不能修改。"}</div>
    <table><thead><tr><th style="width:120px">统一分级</th><th>审批方式</th><th>审批人 / 加签</th><th style="width:170px">默认有效期</th></tr></thead><tbody>
    ${LEVEL_KEYS.map(l=>{const m=LEVELS[l];
      return `<tr><td>${levelChip(l)}</td>
        <td>${editable?cfgSelect(l,"approve"):m.approve}</td>
        <td>${editable?cfgSelect(l,"approver"):m.approver}</td>
        <td>${editable?cfgSelect(l,"valid"):m.valid}</td></tr>`;}).join("")}
    </tbody></table>
  </div>`;

  // ② 跨域升级判断配置（下拉框）
  html+=`<div class="card" style="margin-top:14px">
    <h3>② 跨域升级判断配置 ${editable?`<span class="badge">可配置</span>`:roBadge}</h3>
    <div class="card-sub">${editable?"下拉设定各原分级在跨域调用时「就高定级」到的目标分级；升档目标不得低于原分级。保存后即时驱动升档模拟与申请路由。":"当前视角为消费方，仅可查看升档规则，不能修改。"}</div>
    <table><thead><tr><th style="width:130px">原分级</th><th style="width:200px">跨域升档到</th><th>同域路由</th><th>跨域后审批</th></tr></thead><tbody>
    ${LEVEL_KEYS.map(l=>{const eff=upgrade(l);
      const opts=LEVEL_KEYS.filter(t=>LORDER[t]>=LORDER[l]); // 升档目标不得低于原分级
      return `<tr><td>${levelChip(l)}</td>
        <td>${editable?`<select class="cfg-select cross-sel" data-lvl="${l}">${opts.map(t=>`<option${t===eff?" selected":""}>${t}</option>`).join("")}</select>`
          :(eff!==l?levelChip(eff)+' <span class="cross-badge">⚡升档</span>':'<span style="color:var(--mute)">不变</span>')}</td>
        <td>${LEVELS[l].approve}</td><td>${LEVELS[eff].approve}</td></tr>`;}).join("")}
    </tbody></table>
    ${editable?`<div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn" onclick="saveCfg()">保存配置</button>
      <button class="btn btn-ghost" onclick="viewCfg(el('main'))">重置未保存改动</button>
      <span style="font-size:12px;color:var(--mute)">保存将同时提交上方两类配置</span>
    </div>`:``}
  </div>`;

  // 跨域升档模拟器（实时预览）
  html+=`<div class="card" style="margin-top:14px"><h3>跨域升档模拟器 <span class="badge">随配置实时预览</span></h3>
    <div class="card-sub">跨域判断标准：由实际消费方发起，比对消费方业务线与标签业务线是否一致</div>
    <div class="search-bar">
      <select onchange="crossDemo.consumer=this.value;renderCrossResult()"><option${crossDemo.consumer==="电商"?" selected":""}>电商</option><option${crossDemo.consumer==="生服"?" selected":""}>生服</option></select>
      <span style="align-self:center;color:var(--mute)">消费方所属域　vs　标签供给域</span>
      <select onchange="crossDemo.tag=this.value;renderCrossResult()"><option${crossDemo.tag==="电商"?" selected":""}>电商</option><option${crossDemo.tag==="生服"?" selected":""}>生服</option></select>
    </div>
    <div id="crossResult"></div>
  </div>`;
  c.innerHTML=html;
  renderCrossResult();
}
function saveCfg(){
  // ① 路由配置（下拉）
  document.querySelectorAll(".rt-sel").forEach(sel=>{
    const l=sel.dataset.lvl, f=sel.dataset.f;
    if(l&&f&&LEVELS[l]) LEVELS[l][f]=sel.value;
  });
  // ② 跨域升档配置（下拉，守卫：升档不得低于原级）
  document.querySelectorAll(".cross-sel").forEach(sel=>{
    const l=sel.dataset.lvl;
    if(l&&LORDER[sel.value]>=LORDER[l]) CROSS_CFG[l]=sel.value;
  });
  pushAudit("更新分级与跨域配置");
  toast("✓ 分级与跨域配置已保存并生效");
  viewCfg(el("main"));
}
function renderCrossResult(){
  const box=el("crossResult"); if(!box) return;
  const cross=crossDemo.consumer!==crossDemo.tag;
  const orig="受控"; const eff=cross?upgrade(orig):orig;
  box.innerHTML=`<div class="route-box">
    <div style="margin-bottom:8px">${cross?'<span class="cross-badge">⚡ 跨域</span> 消费方业务线 ≠ 标签业务线':'<span class="level l1">✓ 同域</span> 业务线一致'}</div>
    <div class="flow">
      <div class="flow-step done">原密级：${levelChip(orig)}</div>
      <span class="flow-arrow">→</span>
      ${cross?`<div class="flow-step active">就高定级：${eff}</div><span class="flow-arrow">→</span><div class="flow-step">审批：${LEVELS[eff].approve}</div>`
        :`<div class="flow-step">保持：${LEVELS[orig].approve}</div>`}
    </div>
    ${cross?`<div class="alert warn" style="margin:10px 0 0">非 POC 白名单消费方对受控级 + 的跨域需求，须先经本域 POC 前置收口再进入审批。</div>`:""}
  </div>`;
}

/* ======================= 平台 4.3 审计日志 ======================= */
function viewAudit(c){
  let html=pageHead("审计日志", "4.3",
    "门户侧动作全量留痕，记录 who-when-what（谁、何时、做了什么）；日志不可篡改，支持事后追溯与合规举证。本期为门户侧动作留痕；调用侧全链路留痕依赖源系统开放接口（P1）。",
    {c:"deliver",t:"交付（门户侧动作）"});
  html+=`<div class="card"><h3>审计记录 <span class="badge">保留 ≥ 180 天</span></h3>
    <table><thead><tr><th>时间</th><th>操作人（who）</th><th>动作（what）</th><th>涉及分级</th><th>风险</th></tr></thead><tbody>
    ${AUDIT.map(a=>`<tr><td style="font-size:12px;font-family:'SF Mono',monospace">${a.time}</td><td>${a.who}</td><td>${a.what}</td>
      <td>${a.lvl==="—"?'<span style="color:var(--mute)">—</span>':levelChip(a.lvl)}</td>
      <td><span class="pill" style="${a.risk==="关注"?"background:var(--warn-light);color:var(--warn);border-color:rgba(255,125,0,.3)":""}">${a.risk}</span></td></tr>`).join("")}
    </tbody></table>
  </div>`;
  c.innerHTML=html;
}

/* ======================= 启动 ======================= */
renderRoleGrid();
</script>
</body>
</html>
